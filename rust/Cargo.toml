[package]
name = "madqt_markdown_rs"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib"]

[dependencies]
cxx = "1.0"
pulldown-cmark = "0.13"
# default-fancy: pure-Rust regex (fancy-regex) instead of the Oniguruma C lib,
# so the static build needs no C toolchain for the bundled syntax definitions.
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
